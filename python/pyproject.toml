[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-workflow"
version = "0.1.0"
description = "Python companion labs for the AI Agent learning path"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6",
  "pydantic>=2.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.12"]
agents = ["openai-agents>=0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["research_agent", "research_workflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
